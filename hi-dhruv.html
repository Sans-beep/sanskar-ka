<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hi Dhruv 👋</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0d12;color:#f7f3ea;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle at 50% 40%,#5c4b8a55,transparent 35%),radial-gradient(circle at 20% 80%,#e59bb344,transparent 28%);filter:blur(35px)}
.card{position:relative;width:min(90vw,520px);padding:64px 32px;text-align:center;border:1px solid #ffffff18;border-radius:32px;background:#ffffff09;backdrop-filter:blur(16px);box-shadow:0 30px 100px #0008}
.wave{font-size:70px;display:block;animation:wave 1.8s ease-in-out infinite;transform-origin:70% 80%}
h1{margin:18px 0 8px;font-size:clamp(48px,13vw,82px);letter-spacing:-.06em}
p{margin:0;color:#aaa5b5;font-size:16px}
.spark{position:absolute;font-size:22px;animation:float 4s ease-in-out infinite}
.s1{left:12%;top:18%}.s2{right:14%;top:24%;animation-delay:-1.2s}.s3{left:20%;bottom:18%;animation-delay:-2.1s}.s4{right:17%;bottom:20%;animation-delay:-.7s}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(18deg)}50%{transform:rotate(-8deg)}75%{transform:rotate(12deg)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0);opacity:.45}50%{transform:translateY(-12px) rotate(8deg);opacity:1}}
</style>
</head>
<body>
<main class="card">
  <span class="spark s1">✦</span><span class="spark s2">✧</span>
  <span class="spark s3">·</span><span class="spark s4">✦</span>
  <span class="wave">👋</span>
  <h1>Hi Dhruv!</h1>
  <p>Just wanted to stop by and say hello :)</p>
</main>
</body>
</html>
